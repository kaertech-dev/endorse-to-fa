<!-- endorse.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endorse Rejects To FA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-window">
    <div class="title-bar"><span class="dot"></span> Endorse To FA</div>

    <div class="header-bar">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path fill="#2f8f4e" d="M12 2C8 6 5 9 5 13a7 7 0 0 0 14 0c0-4-3-7-7-11z"/></svg>
      </div>
      <div class="header-text">
        <p class="subtitle">Kaertech</p>
        <h1>Endorse Rejects To FA</h1>
      </div>
    </div>

    <div class="session-strip">
      <span>Signed in as <strong>{{ employee_name }}</strong> ({{ employee_num }})</span>
      <a href="{{ url_for('logout') }}">Sign out</a>
    </div>

    <div class="panel-body">
      <div class="two-col">
        <!-- LEFT COLUMN -->
        <div>
          <div class="field-row">
            <label class="field-label" for="product">Product</label>
            <select id="product"><option value="">Loading…</option></select>
          </div>
          <div class="field-row">
            <label class="field-label" for="model">Model</label>
            <select id="model"><option value="">Loading…</option></select>
          </div>
          <div class="field-row">
            <label class="field-label" for="station">Station</label>
            <select id="station"><option value="">Loading…</option></select>
          </div>

          <div class="field-row">
            <label class="field-label" for="serial_number">Serial Number</label>
            <input type="text" id="serial_number" placeholder="Scan or type serial number">
          </div>

          <div class="field-row">
            <label class="field-label" for="endorser">Endorser</label>
            <div class="endorser-row">
              <input type="text" id="endorser" value="{{ employee_name }}" disabled>
              <button type="button" class="btn-change" id="changeEndorserBtn">Change</button>
            </div>
          </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div>
          <div class="field-row">
            <label class="field-label">Text Display</label>
            <div class="text-display" id="textDisplay">
              Please enter the employee number of the endorser.
            </div>
          </div>
          <div class="field-row">
            <label class="field-label" for="failureMode">Failure Mode</label>
            <textarea id="failureMode" class="readout-box" style="width:100%; resize:vertical; font-family:inherit;" placeholder="Describe the test failure 
e.g. Fail: (Reason)"></textarea>
          </div>
          <div class="field-row">
            <label class="field-label" for="po">PO</label>
            <input type="text" id="po" placeholder="—">
          </div>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-endorse" id="endorseBtn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
        Endorse To FA
      </button>
      <button class="btn btn-exit" onclick="window.location.href='{{ url_for('logout') }}'">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7l-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4L10.6 10.6l6.3-6.3z"/></svg>
        Exit
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
